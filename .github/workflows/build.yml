name: Source and GUI composition contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      gui_composition:
        description: Test admitted exact Demo and GUI revisions (pending until pinned)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned CMake
        shell: pwsh
        run: |
          python -m venv .ci-tools
          .ci-tools/Scripts/python -m pip install cmake==4.4.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure
        run: .ci-tools/Scripts/cmake -S . -B out -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON -DEPOCHMEDIA_BUILD_GUI_DEMO=OFF -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
      - name: Build
        run: .ci-tools/Scripts/cmake --build out --config ${{ matrix.config }} --parallel 2
      - name: CPU contracts
        run: .ci-tools/Scripts/ctest --test-dir out -C ${{ matrix.config }} --output-on-failure
      - name: Source and license receipt
        run: python .github/audit_source.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-${{ matrix.config }}-evidence
          path: |
            source-audit.json
            dependencies.json
            out/Testing/Temporary/LastTest.log
          if-no-files-found: warn
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install compiler and pinned CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-tools-18 ninja-build python3-venv
          python3 -m venv .ci-tools
          .ci-tools/bin/python -m pip install cmake==4.4.2
      - name: Configure
        run: .ci-tools/bin/cmake -S . -B out -G Ninja -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DBUILD_TESTING=ON -DEPOCHMEDIA_BUILD_GUI_DEMO=OFF
      - name: Build
        run: .ci-tools/bin/cmake --build out --parallel 2
      - name: CPU contracts
        run: .ci-tools/bin/ctest --test-dir out --output-on-failure
      - name: Source and license receipt
        run: python3 .github/audit_source.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-${{ matrix.config }}-evidence
          path: |
            source-audit.json
            dependencies.json
            out/Testing/Temporary/LastTest.log
          if-no-files-found: warn

  gui:
    if: github.event_name == 'workflow_dispatch' && inputs.gui_composition
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        graph: [gui]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve exact demonstration dependencies
        if: matrix.graph == 'gui'
        id: pins
        run: python .github/dependency_pins.py
      - uses: actions/checkout@v4
        if: matrix.graph == 'gui'
        with:
          repository: Autodidac/EpochGui
          ref: ${{ steps.pins.outputs.gui }}
          path: dependencies/EpochGui
          persist-credentials: false
      - uses: actions/checkout@v4
        if: matrix.graph == 'gui'
        with:
          repository: Autodidac/EpochGui_Demo
          ref: ${{ steps.pins.outputs.gui_demo }}
          path: dependencies/EpochGui_Demo
          persist-credentials: false
      - name: Install pinned CMake
        run: |
          python -m venv .ci-tools
          .ci-tools/Scripts/python -m pip install cmake==4.4.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure
        shell: pwsh
        run: |
          $gui = if ('${{ matrix.graph }}' -eq 'gui') { 'ON' } else { 'OFF' }
          .ci-tools/Scripts/cmake -S . -B out -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON "-DEPOCHMEDIA_BUILD_GUI_DEMO=$gui" "-DEPOCHGUI_DEMO_ROOT=$pwd/dependencies/EpochGui_Demo" "-DEPOCHGUI_ROOT=$pwd/dependencies/EpochGui" "-DEPOCH_MEDIA_ROOT=$pwd" -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        run: .ci-tools/Scripts/cmake --build out --config Release --parallel 2
      - name: CPU contracts
        run: .ci-tools/Scripts/ctest --test-dir out -C Release --output-on-failure
      - name: Source and license receipt
        run: python .github/audit_source.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.graph }}-source-evidence
          path: |
            source-audit.json
            dependencies.json
            out/Testing/Temporary/LastTest.log
          if-no-files-found: warn
